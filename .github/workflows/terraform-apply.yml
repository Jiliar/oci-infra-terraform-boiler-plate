name: Terraform Apply

on:
  pull_request:
    branches: [dev, test, staging, main]
    types: [closed]

jobs:
  apply:
    name: "${{ matrix.phase_name }} (Fase ${{ matrix.phase }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'dev' ||
       github.event.pull_request.base.ref == 'test' ||
       github.event.pull_request.base.ref == 'staging' ||
       github.event.pull_request.base.ref == 'main')
    
    strategy:
      max-parallel: 1
      matrix:
        phase: [1, 2, 3, 4, 5]
        include:
          # Fase 1 - Red y Seguridad
          - phase: 1
            phase_name: "Red y Seguridad"
            #modules: '["networking", "waf"]'
            modules: '["waf"]'

    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Set Environment
        id: set-env
        run: |
          case "${{ github.event.pull_request.base.ref }}" in
            "dev")
              echo "environment=dev" >> $GITHUB_OUTPUT
              ;;
            "test")
              echo "environment=test" >> $GITHUB_OUTPUT
              ;;
            "staging")
              echo "environment=staging" >> $GITHUB_OUTPUT
              ;;
            "main")
              echo "environment=prod" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Install and Configure OCI CLI
        if: steps.set-env.outputs.environment == 'dev'
        timeout-minutes: 5
        run: |
          pip3 install oci-cli
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config

      - name: Bootstrap Resources Check (Dev Only)
        if: steps.set-env.outputs.environment == 'dev'
        id: bootstrap-check
        timeout-minutes: 10
        continue-on-error: false
        run: |
          echo "🔍 Checking if terraform-state bucket exists..."
          
          # Check if bucket exists
          if oci os bucket get --bucket-name "${{ secrets.OCI_BUCKET_NAME }}" --namespace-name "${{ secrets.OCI_NAMESPACE }}" >/dev/null 2>&1; then
            echo "✅ Bucket ${{ secrets.OCI_BUCKET_NAME }} exists"
            echo "bootstrap_needed=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Bucket ${{ secrets.OCI_BUCKET_NAME }} not found"
            echo "bootstrap_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Bootstrap Bucket (If Needed)
        if: steps.set-env.outputs.environment == 'dev' && steps.bootstrap-check.outputs.bootstrap_needed == 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo "🚀 Creating terraform-state bucket..."
          
          # Create public bucket using OCI CLI
          if oci os bucket create \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --name "${{ secrets.OCI_BUCKET_NAME }}" \
            --namespace "${{ secrets.OCI_NAMESPACE }}" \
            --public-access-type ObjectRead \
            --versioning Enabled 2>/dev/null; then
            echo "✅ Bucket ${{ secrets.OCI_BUCKET_NAME }} created successfully"
          else
            echo "⚠️ Bucket may already exist or creation failed - continuing..."
          fi

      - name: Replace Tokens with Secrets
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        run: |
          sed -i 's|__TENANCY_OCID__|${{ secrets.OCI_TENANCY_OCID }}|g' terraform.tfvars
          sed -i 's|__USER_OCID__|${{ secrets.OCI_USER_OCID }}|g' terraform.tfvars
          sed -i 's|__FINGERPRINT__|${{ secrets.OCI_FINGERPRINT }}|g' terraform.tfvars
          sed -i 's|__COMPARTMENT_ID__|${{ secrets.OCI_COMPARTMENT_ID }}|g' terraform.tfvars
          sed -i 's|__DB_ADMIN_PASSWORD__|${{ secrets.DB_ADMIN_PASSWORD }}|g' terraform.tfvars
          
          cat > terraform.tfvars.tmp << 'EOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          
          awk '
          /__PRIVATE_KEY__/ {
            print "private_key = <<EOK"
            while ((getline line < "terraform.tfvars.tmp") > 0) {
              print line
            }
            print "EOK"
            close("terraform.tfvars.tmp")
            next
          }
          { print }
          ' terraform.tfvars > terraform.tfvars.new
          
          mv terraform.tfvars.new terraform.tfvars
          rm -f terraform.tfvars.tmp

      - name: Terraform Init
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        timeout-minutes: 15
        run: |
          echo "🚀 Initializing Terraform for ${{ steps.set-env.outputs.environment }} environment..."
          terraform init -no-color

      - name: Parse Modules for Phase
        id: phase-modules
        run: |
          MODULES_JSON='${{ matrix.modules }}'
          echo "Modules for phase ${{ matrix.phase }}: $MODULES_JSON"
          echo "modules=$MODULES_JSON" >> $GITHUB_OUTPUT

      - name: Apply Phase Modules
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        timeout-minutes: 35
        continue-on-error: true
        run: |
          PHASE=${{ matrix.phase }}
          MODULES_JSON='${{ steps.phase-modules.outputs.modules }}'
          
          echo "🚀 Applying Phase $PHASE modules..."
          echo "Modules: $MODULES_JSON"
          
          # Convert JSON array to bash array and clean up
          MODULES_CLEAN=$(echo "$MODULES_JSON" | sed 's/\[//g' | sed 's/\]//g' | sed 's/"//g' | tr ',' ' ')
          
          for module in $MODULES_CLEAN; do
            echo "📦 Processing module: $module"
            
            # Skip if already in state
            if terraform state list 2>/dev/null | grep -q "module.$module"; then
              echo "✅ Module $module already exists in state - skipping"
              continue
            fi
            
            echo "🚀 Applying module: $module"
            
            # Apply with error handling for existing resources
            if ! terraform apply -target=module.$module -input=false -no-color -auto-approve 2>&1 | tee apply.log; then
              if grep -q "already exists\|LimitExceeded\|AlreadyExists\|PolicyAlreadyExists\|database named.*already exists\|Limit.*has been already reached\|Work Request error\|work request did not succeed" apply.log; then
                echo "⚠️ Resource creation failed for $module - handling gracefully"
                
                case "$module" in
                  "database")
                    echo "⚠️ Database already exists or tenancy limit reached - skipping"
                    ;;
                  "load_balancer")
                    echo "⚠️ Load balancer failed - likely IP limit reached - skipping"
                    ;;
                  "vault")
                    echo "⚠️ Vault already exists or tenancy limit reached - skipping"
                    ;;
                  "k8s_cluster")
                    echo "⚠️ K8s cluster failed - may need manual intervention - skipping"
                    ;;
                  *)
                    terraform refresh -target=module.$module || true
                    echo "✅ Handled existing resource gracefully for $module"
                    ;;
                esac
              else
                echo "❌ Apply failed for $module with unhandled error"
                cat apply.log
                exit 1
              fi
            else
              echo "✅ Successfully applied module: $module"
            fi
          done
          
          echo "🎉 Phase $PHASE completed successfully"

      - name: Upload State to Bucket (Debugging)
        if: steps.set-env.outputs.environment == 'dev'
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        timeout-minutes: 5
        continue-on-error: true
        env:
          OCI_BUCKET_NAME: ${{ secrets.OCI_BUCKET_NAME }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          TF_ENV: ${{ steps.set-env.outputs.environment }}
          TF_PHASE: ${{ matrix.phase }}
        run: |
          echo "🔎 Verificando Variables para Debugging..."
          echo "   TF_ENV (Environment): $TF_ENV"
          echo "   TF_PHASE (Phase): $TF_PHASE"
          echo "   OCI_BUCKET_NAME: $OCI_BUCKET_NAME"
          echo "   OCI_NAMESPACE: $OCI_NAMESPACE"
          echo "   OCI_REGION: $OCI_REGION"
          echo "-------------------------------------"
          
          echo "📤 Uploading tfstate backup to bucket..."
          
          STATE_FILE="current.tfstate"
          
          if terraform state pull > "$STATE_FILE" 2>/dev/null; then
            echo "✅ State downloaded successfully"
            
            if [ -s "$STATE_FILE" ]; then
              echo "✅ State file has content ($(wc -c < "$STATE_FILE") bytes)"
              
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              STATE_NAME="${TF_ENV}_phase${TF_PHASE}_${TIMESTAMP}.tfstate"
              
              # Debugging del nombre del objeto antes de la subida
              echo "   STATE_FILE local: $STATE_FILE"
              echo "   STATE_NAME (Object): $STATE_NAME"
              
              # Usar variables de entorno de Bash (sin la sintaxis de GitHub Actions)
              if oci os object put \
                --bucket-name "$OCI_BUCKET_NAME" \
                --namespace "$OCI_NAMESPACE" \
                --name "$STATE_NAME" \
                --file "$STATE_FILE"; then
                
                echo "✅ State uploaded as $STATE_NAME"
                echo "🔗 URL: https://objectstorage.${OCI_REGION}.oraclecloud.com/n/${OCI_NAMESPACE}/b/${OCI_BUCKET_NAME}/o/$STATE_NAME"
              else
                echo "❌ Error al subir estado"
                exit 1 # Detener si la subida falla
              fi
            else
              echo "⚠️ State file is empty - skipping upload"
            fi
            
            rm -f "$STATE_FILE"
          else
            echo "⚠️ Could not download state - continuing..."
          fi

      - name: Final Full Apply (Phase 6)
        if: matrix.phase == 5
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        timeout-minutes: 20
        run: |
          echo "🔧 Performing final full apply to catch any dependencies..."
          if ! terraform apply -input=false -no-color -auto-approve; then
            echo "⚠️ Final apply had issues, but continuing..."
          else
            echo "✅ Final apply completed successfully"
          fi

  validate-state:
    runs-on: ubuntu-latest
    needs: apply
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      
      - name: Set Environment
        id: set-env
        run: |
          case "${{ github.event.pull_request.base.ref }}" in
            "dev") echo "environment=dev" >> $GITHUB_OUTPUT ;;
            "test") echo "environment=test" >> $GITHUB_OUTPUT ;;
            "staging") echo "environment=staging" >> $GITHUB_OUTPUT ;;
            "main") echo "environment=prod" >> $GITHUB_OUTPUT ;;
          esac

      - name: Terraform Init
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        run: terraform init -no-color

      - name: Validate State
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        run: |
          echo "🔍 Validating Terraform state..."
          terraform validate
          terraform state list > /dev/null
          echo "✅ State validation passed"
