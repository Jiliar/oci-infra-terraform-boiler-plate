name: Terraform Plan

on:
  pull_request:
    branches: [dev, test, staging, main]
    types: [opened, synchronize, reopened]

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'test' ||
      github.event.pull_request.base.ref == 'staging' ||
      github.event.pull_request.base.ref == 'main'
    strategy:
      matrix:
        module: [networking, k8s_cluster, database, ocir, load_balancer, dns, vault, iam, waf, monitoring]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      
      - name: Set Environment
        id: set-env
        run: |
          if [[ "${{ github.event.pull_request.base.ref }}" == "dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "test" ]]; then
            echo "environment=test" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate Required Secrets Exist
        run: |
          echo "🔍 Validating required secrets..."
          REQUIRED_SECRETS=(
            "OCI_USER_OCID"
            "OCI_FINGERPRINT" 
            "OCI_TENANCY_OCID"
            "OCI_REGION"
            "OCI_PRIVATE_KEY"
            "OCI_COMPARTMENT_ID"
            "OCI_AVAILABILITY_DOMAIN"
          )
          
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [[ -z "${{ secrets[secret] }}" ]]; then
              echo "❌ Missing required secret: $secret"
              exit 1
            else
              echo "✅ Secret $secret is set"
            fi
          done
          echo "🎉 All required secrets are available"
      
      - name: Install and Configure OCI CLI
        if: steps.set-env.outputs.environment == 'dev'
        timeout-minutes: 5
        run: |
          # Install OCI CLI using pip
          pip3 install oci-cli
          
          # Configure OCI CLI
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          
          # Create private key file with proper formatting
          cat > ~/.oci/oci_api_key.pem << 'EOK'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOK
          
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
          
          # Test OCI CLI configuration
          echo "🔧 Testing OCI CLI configuration..."
          oci iam region list --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" --query "data[0].\"name\"" --raw-output
          echo "✅ OCI CLI configured successfully"
      
      - name: Bootstrap Resources Check (Dev Only)
        if: steps.set-env.outputs.environment == 'dev'
        timeout-minutes: 30
        run: |
          echo "🔍 Checking bootstrap resources for dev environment..."
          
          # Check if compartment exists
          echo "📦 Checking compartment: ${{ secrets.OCI_COMPARTMENT_ID }}"
          if oci iam compartment get --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" >/dev/null 2>&1; then
            echo "✅ Compartment exists and is accessible"
          else
            echo "❌ Compartment not found or not accessible: ${{ secrets.OCI_COMPARTMENT_ID }}"
            echo "💡 Tip: Check if:"
            echo "   - The compartment OCID is correct"
            echo "   - The user has permissions to read the compartment"
            echo "   - The compartment exists in the tenancy"
            exit 1
          fi
          
          # Check if availability domain exists
          echo "🌍 Checking availability domain: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}"
          AD_RESULT=$(oci iam availability-domain list \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --query "data[?name=='${{ secrets.OCI_AVAILABILITY_DOMAIN }}']" \
            --raw-output)
          
          if [[ -n "$AD_RESULT" && "$AD_RESULT" != "[]" ]]; then
            echo "✅ Availability domain exists: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}"
          else
            echo "❌ Availability domain not found: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}"
            echo "Available domains in tenancy:"
            oci iam availability-domain list --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" --query "data[].name" --raw-output
            exit 1
          fi
          
          echo "🎉 All bootstrap resources verified for dev environment"
      
      - name: Replace Tokens with Secrets
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        run: |
          # Create backup of terraform.tfvars
          cp terraform.tfvars terraform.tfvars.backup
          
          # Replace tokens with actual secret values
          sed -i 's/__TENANCY_OCID__/${{ secrets.OCI_TENANCY_OCID }}/g' terraform.tfvars
          sed -i 's/__USER_OCID__/${{ secrets.OCI_USER_OCID }}/g' terraform.tfvars
          sed -i 's/__FINGERPRINT__/${{ secrets.OCI_FINGERPRINT }}/g' terraform.tfvars
          sed -i 's/__COMPARTMENT_ID__/${{ secrets.OCI_COMPARTMENT_ID }}/g' terraform.tfvars
          sed -i 's/__DB_ADMIN_PASSWORD__/${{ secrets.DB_ADMIN_PASSWORD }}/g' terraform.tfvars
          
          # Replace private key token with multiline secret
          cat > temp_private_key.txt << 'EOK'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOK
          
          # Replace __PRIVATE_KEY__ token with actual private key
          sed -i '/__PRIVATE_KEY__/r temp_private_key.txt' terraform.tfvars
          sed -i '/__PRIVATE_KEY__/d' terraform.tfvars
          rm temp_private_key.txt
          
          echo "🔧 Token replacement completed"
      
      - name: Terraform Init
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        timeout-minutes: 10
        continue-on-error: false
        run: |
          echo "🚀 Initializing Terraform for ${{ steps.set-env.outputs.environment }} environment..."
          terraform init -no-color
      
      - name: Terraform Plan Module
        working-directory: environments/oci/${{ steps.set-env.outputs.environment }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          if [[ "${{ matrix.module }}" == "k8s_cluster" ]]; then
            # Exclude node pools from k8s_cluster deployment
            terraform plan -input=false -no-color -target=module.k8s_cluster.oci_containerengine_cluster.oke
          else
            terraform plan -input=false -no-color -target=module.${{ matrix.module }}
          fi