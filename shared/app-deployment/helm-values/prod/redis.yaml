# Redis - Production Environment
architecture: replication

auth:
  enabled: true
  password: "prod-redis-secure-password"

master:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "oci-bv"

replica:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "oci-bv"

sentinel:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

metrics:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

networkPolicy:
  enabled: true

serviceAccount:
  create: true

# Production specific configurations
commonConfiguration: |-
  # Redis production configuration
  maxmemory-policy allkeys-lru
  timeout 300
  tcp-keepalive 300

# Istio specific
istio:
  enabled: true
  destinationRule:
    enabled: true
    trafficPolicy:
      tls:
        mode: ISTIO_MUTUAL